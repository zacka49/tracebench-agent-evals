<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TraceBench agent reliability evaluation</title>
  <desc id="desc">A frozen task passes through an agent, guarded tool gateway, fault injector and independent world-state scorer.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151026"/><stop offset="1" stop-color="#2c1942"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#c4a7ff"/></marker></defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <text x="64" y="76" fill="#fff" font-family="Segoe UI,Arial" font-size="42" font-weight="700">TraceBench</text>
  <text x="64" y="112" fill="#d1bde7" font-family="Segoe UI,Arial" font-size="21">Score what the agent changed—not what it claimed</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(64 170)"><rect width="210" height="126" rx="18" fill="#352452" stroke="#785ca5"/><text x="22" y="38" fill="#c4a7ff" font-size="15" font-weight="700">FROZEN INPUT</text><text x="22" y="73" fill="white" font-size="21" font-weight="600">Task + condition</text><text x="22" y="101" fill="#d1bde7" font-size="15">3 families · 4 faults</text></g>
    <g transform="translate(330 170)"><rect width="210" height="126" rx="18" fill="#352452" stroke="#785ca5"/><text x="22" y="38" fill="#c4a7ff" font-size="15" font-weight="700">BOUNDED AGENT</text><text x="22" y="73" fill="white" font-size="21" font-weight="600">Prompt + controls</text><text x="22" y="101" fill="#d1bde7" font-size="15">Matched task budgets</text></g>
    <g transform="translate(596 170)"><rect width="240" height="126" rx="18" fill="#4b283e" stroke="#c46a8a"/><text x="22" y="38" fill="#ff9fbd" font-size="15" font-weight="700">ACTION GATEWAY</text><text x="22" y="73" fill="white" font-size="21" font-weight="600">Faults + permissions</text><text x="22" y="101" fill="#e9bed0" font-size="15">Ambiguity · stale evidence</text></g>
    <g transform="translate(892 170)"><rect width="244" height="126" rx="18" fill="#214741" stroke="#4bb8a7"/><text x="22" y="38" fill="#7fe3d2" font-size="15" font-weight="700">INDEPENDENT SCORE</text><text x="22" y="73" fill="white" font-size="21" font-weight="600">State + event trace</text><text x="22" y="101" fill="#bee7df" font-size="15">Effects beat self-report</text></g>
  </g>
  <g stroke="#c4a7ff" stroke-width="4" marker-end="url(#a)"><path d="M274 233H320"/><path d="M540 233H586"/><path d="M836 233H882"/></g>
  <g transform="translate(64 350)" font-family="Segoe UI,Arial">
    <rect width="1072" height="206" rx="22" fill="#1c1630" stroke="#4a3a68"/>
    <text x="30" y="43" fill="#d1bde7" font-size="17" font-weight="700">WHAT THE HARNESS DISTINGUISHES</text>
    <g transform="translate(30 70)"><circle cx="16" cy="16" r="16" fill="#4bb8a7"/><text x="48" y="22" fill="white" font-size="20" font-weight="600">Verified completion</text><text x="48" y="51" fill="#bfaed2" font-size="15">Correct target state and one intended effect</text></g>
    <g transform="translate(430 70)"><circle cx="16" cy="16" r="16" fill="#d77898"/><text x="48" y="22" fill="white" font-size="20" font-weight="600">False completion</text><text x="48" y="51" fill="#bfaed2" font-size="15">Confident claim with incorrect world state</text></g>
    <g transform="translate(800 70)"><circle cx="16" cy="16" r="16" fill="#b48bff"/><text x="48" y="22" fill="white" font-size="20" font-weight="600">Recovery</text><text x="48" y="51" fill="#bfaed2" font-size="15">Reconcile uncertain writes before retry</text></g>
    <text x="30" y="172" fill="#806f9a" font-size="14">64-episode scripted control validates the harness; model-backed pilots are labelled separately</text>
  </g>
</svg>
