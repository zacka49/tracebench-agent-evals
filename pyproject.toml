[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracebench-agent-evals"
version = "0.1.0"
description = "A reproducible benchmark for tool-using agent reliability under ambiguous failures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tracebench = "tracebench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

